<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:6px;background:rgba(118,100,86,.12);border-radius:10px;padding:0 10px;height:40px">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6259" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
  <input value="{{ value }}" onChange="{{ change }}" placeholder="{{ placeholder }}" aria-label="{{ placeholder }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:400 17px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#231C16;height:100%">
  <sc-if value="{{ hasValue }}"><button onClick="{{ clear }}" aria-label="Clear search" style="flex:none;min-height:40px;padding:0 0 0 6px;border:0;background:none;cursor:pointer;font:600 13px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#6E6259">Clear</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:60},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search all ingredients&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const value = p.value ?? '';
    return {
      value, placeholder: p.placeholder ?? 'Search',
      hasValue: !!value,
      change: e => p.onChange && p.onChange(e),
      clear: () => p.onClear ? p.onClear() : (p.onChange && p.onChange({ target: { value: '' } }))
    };
  }
}
</script>
</body>
</html>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

31C16\">How much time do you have?<\u002Fspan><\u002Fdiv>\n      <div style=\"font:500 12px/1.3 Manrope,sans-serif;color:#9A8A7A;margin-bottom:14px\">Start to finish, including prep<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n        <sc-for list=\"{{ times }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onPick }}\" style=\"padding:15px 4px;border-radius:12px;font:700 15px/1.1 Manrope,sans-serif;transition:all .16s ease;border:1.5px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid rgba(35,28,22,.08);border-radius:18px;padding:20px 18px;box-shadow:0 2px 6px rgba(35,28,22,.04);margin-top:14px\">\n      <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:3px\"><span style=\"width:20px;height:20px;flex:none;border-radius:50%;background:#231C16;color:#FDFAF6;font:700 11px/20px Manrope,sans-serif;text-align:center\">2<\u002Fspan><span style=\"font:700 15px/1.2 Manrope,sans-serif;color:#231C16\">What's your main ingredient?<\u002Fspan><\u002Fdiv>\n      <div style=\"font:500 12px/1.3 Manrope,sans-serif;color:#9A8A7A;margin-bottom:14px\">Pick the one thing dinner is built around<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ mains }}\" as=\"m\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ m.onPick }}\" style=\"padding:11px 15px;border-radius:100px;font:600 14px/1.1 Manrope,sans-serif;transition:all .16s ease;border:1.5px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;border-top:1px dashed rgba(35,28,22,.14);padding-top:16px\">\n      <button sc-camel-on-click=\"{{ toggleOptional }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;padding:4px 2px\">\n        <span style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px\">\n          <span style=\"font:600 14px/1.2 Manrope,sans-serif;color:#6C5F53\">Want better matches?<\u002Fspan>\n          <span style=\"font:500 12px/1.2 Manrope,sans-serif;color:#A3937F\">{{ optionalSubtitle }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#A3937F;border:1px solid rgba(35,28,22,.16);border-radius:8px;padding:6px 9px\">{{ optionalToggleLabel }}<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ optionalOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"animation:dfade .25s ease both;padding:16px 2px 0\">\n          <div style=\"font:600 12px/1.2 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#A3937F;margin-bottom:12px\">In the mood for<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;background:#FBF6EF;border-radius:12px;padding:12px\">\n            <sc-for list=\"{{ moods }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ d.onPick }}\" style=\"padding:8px 12px;border-radius:9px;font:500 13px/1.1 Manrope,sans-serif;transition:all .14s ease;border:1px solid {{ d.bd }};background:{{ d.bg }};color:{{ d.fg }}\">{{ d.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:600 12px/1.2 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#A3937F;margin:20px 0 12px\">Other ingredients you have<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ extraGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"background:#FBF6EF;border-radius:12px;padding:11px 12px 12px\">\n                <div style=\"font:700 11.5px/1.2 Manrope,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#8A7A6B;margin-bottom:9px\">{{ g.label }}<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ g.items }}\" as=\"e\" hint-placeholder-count=\"8\">\n                    <button sc-camel-on-click=\"{{ e.onPick }}\" style=\"padding:8px 11px;border-radius:9px;font:500 13px/1.1 Manrope,sans-serif;transition:all .14s ease;border:1px solid {{ e.bd }};background:{{ e.bg }};color:{{ e.fg }}\">{{ e.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none\">\n    <div style=\"width:100%;max-width:430px;padding:16px 20px 20px;background:linear-gradient(180deg,rgba(253,250,246,0) 0%,#FDFAF6 45%);pointer-events:auto\">\n      <button sc-camel-on-click=\"{{ submit }}\" style=\"width:100%;padding:18px;border-radius:15px;background:#C0522C;color:#FFF7F0;font:700 17px/1 Manrope,sans-serif;letter-spacing:.01em;box-shadow:0 6px 18px rgba(192,82,44,.28);transition:transform .12s ease\" style-hover=\"transform:translateY(-1px)\" style-active=\"transform:translateY(1px)\">What can I make?<\u002Fbutton>\n      <div style=\"text-align:center;font:500 11.5px/1.3 Manrope,sans-serif;color:#A3937F;margin-top:9px\">{{ summaryLine }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOptions }}\">\n<div style=\"animation:dfade .32s ease both;padding:0 0 32px\">\n  <div style=\"position:sticky;top:0;z-index:5;background:rgba(253,250,246,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(35,28,22,.07);padding:18px 20px 14px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:6px;font:600 13px/1 Manrope,sans-serif;color:#C0522C\">← Home<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:7px;height:7px;border-radius:50%;background:#C0522C\"><\u002Fdiv><span style=\"font:700 11px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8A7A6B\">MakeDo<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:0;font:400 28px/1.1 'Instrument Serif',Georgia,serif;color:#231C16\">{{ optionsTitle }}<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:11px\">\n      <sc-for list=\"{{ criteria }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <span style=\"padding:6px 10px;border-radius:7px;background:#F3E9DC;font:600 12px/1 Manrope,sans-serif;color:#7A6A59\">{{ c }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:18px 20px 0;display:flex;flex-direction:column;gap:16px\">\n    <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"4\">\n      <div style=\"background:#FFFFFF;border:1px solid rgba(35,28,22,.09);border-radius:20px;overflow:hidden;box-shadow:0 3px 10px rgba(35,28,22,.05)\">\n        <div style=\"height:152px;position:relative;background:repeating-linear-gradient(135deg,{{ o.tintA }} 0 12px,{{ o.tintB }} 12px 24px);display:flex;align-items:flex-end;justify-content:space-between;padding:12px\">\n          <span style=\"font:400 10.5px/1.3 'IBM Plex Mono',monospace;color:rgba(35,28,22,.5);background:rgba(255,255,255,.82);border-radius:6px;padding:5px 8px\">photo: {{ o.photo }}<\u002Fspan>\n          <span style=\"font:700 12.5px/1 Manrope,sans-serif;color:#231C16;background:rgba(255,255,255,.92);border-radius:100px;padding:7px 11px\">{{ o.timeLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:15px 16px 16px\">\n          <div style=\"font:700 18.5px/1.25 Manrope,sans-serif;color:#231C16;text-wrap:pretty\">{{ o.name }}<\u002Fdiv>\n          <div style=\"font:500 13px/1.45 Manrope,sans-serif;color:#8A7A6B;margin-top:5px\">{{ o.blurb }}<\u002Fdiv>\n\n          <div style=\"margin-top:13px;background:#FBF6EF;border-radius:13px;padding:4px\">\n            <button sc-camel-on-click=\"{{ o.onToggleHave }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 11px\">\n              <span style=\"display:flex;align-items:center;gap:8px;font:600 13.5px/1.2 Manrope,sans-serif;color:#3E6B4F\">✓ {{ o.haveLabel }}<\u002Fspan>\n              <span style=\"font:500 11px/1 'IBM Plex Mono',monospace;color:#A3937F\">{{ o.haveCaret }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ o.showHave }}\">\n              <div style=\"animation:dexp .22s ease both;overflow:hidden;display:flex;flex-wrap:wrap;gap:6px;padding:2px 11px 12px\">\n                <sc-for list=\"{{ o.haveNames }}\" as=\"n\" hint-placeholder-count=\"5\">\n                  <span style=\"padding:6px 10px;border-radius:8px;background:#E7F0E8;font:500 12.5px/1 Manrope,sans-serif;color:#3E6B4F\">{{ n }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"height:1px;background:rgba(35,28,22,.07);margin:0 11px\"><\u002Fdiv>\n\n            <button sc-camel-on-click=\"{{ o.onToggleMissing }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 11px\">\n              <span style=\"display:flex;align-items:center;gap:8px;font:600 13.5px/1.2 Manrope,sans-serif;color:{{ o.missingColor }}\">{{ o.missingMark }} {{ o.missingLabel }}<\u002Fspan>\n              <span style=\"font:500 11px/1 'IBM Plex Mono',monospace;color:#A3937F\">{{ o.missingCaret }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ o.showMissing }}\">\n              <div style=\"animation:dexp .22s ease both;overflow:hidden;padding:2px 11px 12px;display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ o.missing }}\" as=\"m\" hint-placeholder-count=\"1\">\n                  <div style=\"border-left:2px solid #DFB48C;padding-left:10px\">\n                    <div style=\"font:600 13px/1.3 Manrope,sans-serif;color:#231C16\">{{ m.name }}<\u002Fdiv>\n                    <sc-if value=\"{{ m.hasSub }}\">\n                      <div style=\"font:500 12.5px/1.4 Manrope,sans-serif;color:#3E6B4F;margin-top:2px\">Substitute: {{ m.sub }} ✓<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ o.onPick }}\" style=\"width:100%;margin-top:13px;padding:14px;border-radius:13px;background:#231C16;color:#FDFAF6;font:700 15px/1 Manrope,sans-serif;transition:opacity .14s ease\" style-hover=\"opacity:.88\">View this meal<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"text-align:center;font:500 12.5px/1.5 Manrope,sans-serif;color:#A3937F;padding:6px 20px 0\">{{ optionsFooter }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecipe }}\">\n<div style=\"animation:dfade .32s ease both;padding:0 0 40px\">\n  <div style=\"height:210px;position:relative;background:repeating-linear-gradient(135deg,{{ rTintA }} 0 14px,{{ rTintB }} 14px 28px)\">\n    <div style=\"position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px\">\n      <button sc-camel-on-click=\"{{ goOptions }}\" style=\"padding:9px 13px;border-radius:100px;background:rgba(253,250,246,.94);font:700 13px/1 Manrope,sans-serif;color:#231C16;box-shadow:0 2px 8px rgba(35,28,22,.12)\">← Options<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"padding:9px 13px;border-radius:100px;background:rgba(253,250,246,.94);font:700 13px/1 Manrope,sans-serif;color:#231C16;box-shadow:0 2px 8px rgba(35,28,22,.12)\">Home<\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"position:absolute;bottom:12px;left:16px;font:400 10.5px/1.3 'IBM Plex Mono',monospace;color:rgba(35,28,22,.5);background:rgba(255,255,255,.82);border-radius:6px;padding:5px 8px\">photo: {{ rPhoto }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"padding:20px 20px 0\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px\">\n      <h2 style=\"margin:0;font:400 32px/1.08 'Instrument Serif',Georgia,serif;color:#231C16;text-wrap:pretty\">{{ rName }}<\u002Fh2>\n      <button sc-camel-on-click=\"{{ toggleFav }}\" aria-label=\"Save to favorites\" style=\"flex:none;width:44px;height:44px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 21px/1 Manrope,sans-serif;transition:all .16s ease;border:1.5px solid {{ favBd }};background:{{ favBg }};color:{{ favFg }}\">{{ favIcon }}<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isFav }}\">\n      <div style=\"margin-top:8px;font:600 12.5px/1.3 Manrope,sans-serif;color:#B9743F\">Saved to favorites<\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:13px\">\n      <sc-for list=\"{{ rMeta }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <span style=\"padding:7px 11px;border-radius:8px;background:#F3E9DC;font:600 12.5px/1 Manrope,sans-serif;color:#7A6A59\">{{ m }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font:400 14.5px/1.6 Manrope,sans-serif;color:#6C5F53;text-wrap:pretty\">{{ rBlurb }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"padding:22px 20px 0\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(35,28,22,.09);border-radius:18px;padding:18px;box-shadow:0 2px 8px rgba(35,28,22,.04)\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px\">\n        <div style=\"font:700 16px/1.2 Manrope,sans-serif;color:#231C16\">Ingredients<\u002Fdiv>\n        <div style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#A3937F\">{{ rIngCount }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px\">\n        <sc-for list=\"{{ rHave }}\" as=\"h\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;align-items:flex-start;gap:10px\">\n            <span style=\"width:18px;height:18px;flex:none;border-radius:50%;background:#E7F0E8;color:#3E6B4F;font:700 11px/18px Manrope,sans-serif;text-align:center\">✓<\u002Fspan>\n            <span style=\"font:500 14.5px/1.35 Manrope,sans-serif;color:#231C16\">{{ h }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ rHasMissing }}\">\n        <div style=\"margin-top:16px;padding-top:15px;border-top:1px dashed rgba(35,28,22,.16)\">\n          <div style=\"font:700 12px/1.2 Manrope,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#B9743F;margin-bottom:11px\">{{ rMissingHeading }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ rMissing }}\" as=\"m\" hint-placeholder-count=\"1\">\n              <div style=\"background:#FDF3E8;border-radius:12px;padding:12px 13px\">\n                <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                  <span style=\"width:18px;height:18px;flex:none;border-radius:50%;background:#F2DCC2;color:#B9743F;font:700 12px/18px Manrope,sans-serif;text-align:center\">·<\u002Fspan>\n                  <span style=\"font:600 14.5px/1.35 Manrope,sans-serif;color:#231C16\">{{ m.full }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ m.hasSub }}\">\n                  <div style=\"margin:9px 0 0 28px;padding-left:11px;border-left:2px solid #DFB48C\">\n                    <div style=\"font:600 11px/1.2 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#A3937F;margin-bottom:3px\">Use instead<\u002Fdiv>\n                    <div style=\"font:600 14px/1.4 Manrope,sans-serif;color:#3E6B4F\">{{ m.subLine }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rAllSet }}\">\n        <div style=\"margin-top:15px;background:#E7F0E8;border-radius:12px;padding:13px;font:700 14px/1.35 Manrope,sans-serif;color:#3E6B4F\">You already have everything you need.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:16px 20px 0\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(35,28,22,.09);border-radius:18px;padding:18px;box-shadow:0 2px 8px rgba(35,28,22,.04)\">\n      <div style=\"font:700 16px/1.2 Manrope,sans-serif;color:#231C16;margin-bottom:15px\">How to make it<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:15px\">\n        <sc-for list=\"{{ rSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:12px\">\n            <span style=\"width:25px;height:25px;flex:none;border-radius:50%;background:#231C16;color:#FDFAF6;font:700 12.5px/25px Manrope,sans-serif;text-align:center\">{{ s.n }}<\u002Fspan>\n            <span style=\"font:400 14.5px/1.55 Manrope,sans-serif;color:#3B322A;text-wrap:pretty;padding-top:3px\">{{ s.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:20px 20px 0;display:flex;gap:10px\">\n    <button sc-camel-on-click=\"{{ goOptions }}\" style=\"flex:1;padding:15px;border-radius:13px;border:1.5px solid rgba(35,28,22,.16);background:#FDFAF6;font:700 14.5px/1 Manrope,sans-serif;color:#231C16\">Back to options<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex:1;padding:15px;border-radius:13px;background:#C0522C;color:#FFF7F0;font:700 14.5px/1 Manrope,sans-serif\">Start over<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;optionalOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;sortMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Best fit&quot;,&quot;Fastest first&quot;],&quot;default&quot;:&quot;Best fit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showSubstitutions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst R = (id, name, time, photo, tint, blurb, h, m, s) => ({ id, name, time, photo, tintA: tint[0], tintB: tint[1], blurb, h, m, s });\nconst T = { warm: ['#F2DFC6', '#EDD6B8'], green: ['#E2EBDD', '#D8E4D2'], red: ['#F3DBD2', '#EED0C4'], gold: ['#F4E6C4', '#EFDDB4'] };\n\nconst DATA = {\n  Chicken: [\n    R('c5', 'Garlic Chicken & Broccoli Rice Bowl', 15, 'chicken rice bowl', T.green, 'Everything in one pan while the rice steams.',\n      ['1 lb chicken breast, cubed', '1 head broccoli, florets', '3 cloves garlic, minced', '2 tbsp soy sauce', '1 tbsp honey', '1 cup rice'], [],\n      ['Start the rice — 1 cup rice to 2 cups water, lid on, low heat.', 'Sear the chicken in a hot oiled pan, 4 minutes, until browned.', 'Add broccoli and garlic, splash in 2 tbsp water, cover 3 minutes.', 'Stir in soy sauce and honey, toss 1 minute, and spoon over the rice.']),\n    R('c1', 'Sesame-Ginger Chicken Stir-Fry', 25, 'chicken stir-fry', T.warm, 'Fast, glossy, and forgiving — good with whatever vegetable is oldest.',\n      ['1 lb chicken thighs, sliced', '1 bell pepper, strips', '3 cloves garlic, minced', '1 tbsp fresh ginger, grated', '3 tbsp soy sauce', '1 tbsp honey', '1 cup rice'],\n      [{ n: 'sesame oil', q: '1 tbsp', sub: 'olive oil', sq: '1 tbsp' }],\n      ['Cook the rice. Meanwhile whisk soy sauce, honey and ginger in a small bowl.', 'Get a wide pan very hot with the oil. Add chicken in one layer, leave it 3 minutes.', 'Toss in pepper and garlic; stir-fry 3 minutes so the pepper keeps its bite.', 'Pour in the sauce and let it bubble down 2 minutes until it coats the chicken.', 'Serve over rice with a spoonful of pan sauce.']),\n    R('c3', 'Crispy Chicken Tacos with Quick Slaw', 20, 'chicken tacos', T.gold, 'Crunchy slaw does the work of a side dish.',\n      ['1 lb chicken breast, thin sliced', '8 small tortillas', '2 cups shredded cabbage', '1 lime', '1/4 cup sour cream', '1 tsp chili powder', '1 tsp cumin'],\n      [{ n: 'fresh cilantro', q: '1/4 cup', sub: 'scallion tops', sq: '2 tbsp, sliced' }],\n      ['Toss the chicken with chili powder, cumin and salt.', 'Sear 3 minutes per side in a hot pan, then rest and slice.', 'Mix cabbage with lime juice, sour cream and a pinch of salt.', 'Warm the tortillas in the dry pan, 20 seconds a side.', 'Build: chicken, slaw, extra lime.']),\n    R('c2', 'Lemon-Garlic Chicken & Rice Skillet', 30, 'chicken and rice skillet', T.warm, 'One pan, no measuring anxiety, leftovers reheat well.',\n      ['4 chicken thighs, bone-in', '1 cup long-grain rice', '2 cups chicken broth', '1 lemon, halved', '4 cloves garlic, smashed', '1 onion, diced', '1 tsp dried oregano', '2 tbsp olive oil'], [],\n      ['Brown the thighs skin-down in the oil, 6 minutes. Set aside.', 'Soften onion and garlic in the same pan, 3 minutes.', 'Stir in rice and oregano, then the broth and a squeeze of lemon.', 'Nestle the chicken back in, cover, and cook low 18 minutes.', 'Rest 3 minutes off heat; finish with the rest of the lemon.']),\n    R('c4', 'Chicken, Spinach & Tomato Pasta', 30, 'creamy chicken pasta', T.red, 'A weeknight cream sauce that comes together in the time pasta boils.',\n      ['1 lb chicken breast, cubed', '12 oz pasta', '2 cups cherry tomatoes', '3 cups spinach', '3 cloves garlic, minced', '2 tbsp butter', '1 tsp chili flakes'],\n      [{ n: 'heavy cream', q: '1/2 cup', sub: 'whole milk + butter', sq: '1/2 cup milk + 1 tbsp butter' }, { n: 'parmesan', q: '1/3 cup, grated', sub: null, sq: null }],\n      ['Boil the pasta, saving a mug of the water before draining.', 'Brown the chicken in butter, 5 minutes, then add garlic and chili flakes.', 'Add tomatoes and press them with a spoon until they slump, 4 minutes.', 'Pour in the cream, add spinach, and stir until it wilts.', 'Toss with pasta, loosening with the reserved water.'])\n  ],\n  'Ground Beef': [\n    R('b4', 'Beef & Egg Fried Rice', 15, 'beef fried rice', T.gold, 'Best with rice from the fridge — dry grains fry better.',\n      ['1/2 lb ground beef', '3 cups cooked rice, cold', '2 eggs, beaten', '3 tbsp soy sauce', '2 scallions, sliced', '1 cup frozen peas'], [],\n      ['Brown the beef hard in a dry hot pan, breaking it small. Push to one side.', 'Scramble the eggs in the empty half, then fold together.', 'Add rice and peas; press and fry 3 minutes without stirring much.', 'Finish with soy sauce and scallions.']),\n    R('b1', 'One-Pan Taco Skillet', 25, 'taco skillet', T.red, 'All the taco flavor, none of the assembly line.',\n      ['1 lb ground beef', '1 can black beans, drained', '1 cup corn', '1 onion, diced', '1 cup salsa', '1 cup shredded cheese', '2 tsp chili powder'],\n      [{ n: 'lime', q: '1, for serving', sub: 'lemon', sq: '1/2, juiced' }],\n      ['Brown the beef with the onion, 6 minutes; drain the fat.', 'Stir in chili powder, beans, corn and salsa. Simmer 8 minutes.', 'Scatter the cheese over, cover, and let it melt 2 minutes.', 'Serve straight from the pan with a squeeze of citrus.']),\n    R('b2', 'Cheesy Beef & Pasta Bake', 40, 'beef pasta bake', T.warm, 'Worth the extra ten minutes when you want leftovers.',\n      ['1 lb ground beef', '12 oz short pasta', '1 jar marinara', '2 cups mozzarella, shredded', '1 onion, diced', '3 cloves garlic, minced', '1 tsp dried oregano'],\n      [{ n: 'ricotta', q: '1 cup', sub: 'cottage cheese', sq: '1 cup, blended smooth' }],\n      ['Heat the oven to 400°F and boil the pasta 2 minutes short of done.', 'Brown the beef with onion and garlic; add marinara and oregano.', 'Fold pasta, sauce and ricotta together in a baking dish.', 'Top with mozzarella and bake 18 minutes until bubbling at the edges.'])\n  ],\n  Vegetarian: [\n    R('v3', 'Black Bean & Cheese Quesadillas', 15, 'quesadillas', T.gold, 'Crisp outside, molten inside, done in one pan.',\n      ['4 large tortillas', '1 can black beans, drained', '2 cups shredded cheese', '1/2 onion, diced', '1 tsp cumin', '1/2 cup salsa'], [],\n      ['Mash half the beans with cumin and a pinch of salt.', 'Cook the onion 3 minutes, then stir into the beans.', 'Fill tortillas with beans and cheese; fold.', 'Dry-pan each one 2 minutes a side until spotted and crisp. Cut in wedges.']),\n    R('v1', 'Mushroom & Spinach Pasta', 25, 'mushroom pasta', T.green, 'Deeply savory without much in it — brown the mushrooms properly.',\n      ['12 oz pasta', '1 lb mushrooms, sliced', '4 cups spinach', '3 cloves garlic, minced', '2 tbsp butter', '1/3 cup parmesan, grated'],\n      [{ n: 'white wine', q: '1/4 cup', sub: 'vegetable broth + lemon', sq: '1/4 cup broth + 1 tsp lemon' }],\n      ['Boil the pasta; reserve a mug of water.', 'Cook mushrooms in butter in a single layer, 6 minutes, undisturbed, then salt.', 'Add garlic, then deglaze with the wine or broth.', 'Add spinach and pasta, toss with parmesan and enough pasta water to gloss it.']),\n    R('v2', 'Chickpea Coconut Curry', 30, 'chickpea curry', T.gold, 'Pantry-deep and better the next day.',\n      ['2 cans chickpeas, drained', '1 can coconut milk', '1 onion, diced', '3 cloves garlic, minced', '2 tbsp curry powder', '1 can diced tomatoes', '1 cup rice', '3 cups spinach'], [],\n      ['Start the rice.', 'Soften onion 5 minutes, then garlic and curry powder for 1 minute until fragrant.', 'Add tomatoes, chickpeas and coconut milk; simmer 15 minutes.', 'Stir in spinach, season with salt, and serve over rice.'])\n  ],\n  Steak: [\n    R('s2', 'Steak Salad with Balsamic', 20, 'steak salad', T.green, 'Warm steak over cold greens — dinner that feels light.',\n      ['1 lb sirloin steak', '6 cups mixed greens', '2 cups cherry tomatoes', '1/4 red onion, thin sliced', '3 tbsp olive oil', '2 tbsp balsamic vinegar'], [],\n      ['Salt the steak well and sear 3–4 minutes a side in a very hot pan.', 'Rest it 5 minutes — this is not optional.', 'Whisk oil and balsamic with salt and pepper.', 'Slice the steak against the grain and pile it over dressed greens.']),\n    R('s1', 'Garlic Butter Steak Bites & Potatoes', 30, 'steak bites and potatoes', T.warm, 'Crisp potatoes first, steak last, one pan throughout.',\n      ['1 lb sirloin, cubed', '1 lb baby potatoes, halved', '4 cloves garlic, minced', '3 tbsp butter', '2 tbsp olive oil', '1 tsp dried thyme'],\n      [{ n: 'fresh parsley', q: '2 tbsp, chopped', sub: 'scallion tops', sq: '2 tbsp, sliced' }],\n      ['Boil the potatoes 8 minutes, drain well, then crisp them in the oil, 8 minutes.', 'Move potatoes out. Sear the steak cubes 2 minutes without moving them.', 'Add butter, garlic and thyme; toss 1 minute as it foams.', 'Return the potatoes, toss, and finish with the herbs.'])\n  ],\n  Pork: [\n    R('p2', 'Pork Fried Rice', 20, 'pork fried rice', T.gold, 'Fast, salty, and endlessly flexible.',\n      ['1 lb pork loin, diced', '3 cups cooked rice, cold', '2 eggs, beaten', '1 cup frozen peas and carrots', '3 tbsp soy sauce', '2 scallions, sliced'], [],\n      ['Sear the pork in a hot pan 4 minutes until edges brown.', 'Scramble the eggs alongside, then combine.', 'Add rice and vegetables; fry 4 minutes, pressing the rice down.', 'Season with soy sauce and scatter scallions over.']),\n    R('p1', 'Pork Chops with Apple Pan Sauce', 30, 'pork chops with pan sauce', T.warm, 'The sauce is just the pan, deglazed — three minutes of work.',\n      ['4 bone-in pork chops', '2 apples, sliced', '1 onion, sliced', '2 tbsp butter', '1 cup chicken broth', '1 tsp dried thyme'],\n      [{ n: 'apple cider vinegar', q: '1 tbsp', sub: 'lemon juice', sq: '2 tsp' }],\n      ['Salt the chops and sear 4 minutes a side; rest on a plate.', 'Cook onion and apple in the butter until golden, 6 minutes.', 'Pour in broth and vinegar, scraping the pan; reduce by half.', 'Add thyme, return the chops with their juices, and spoon the sauce over.'])\n  ],\n  Fish: [\n    R('f1', 'Lemon Butter Salmon & Asparagus', 20, 'salmon and asparagus', T.green, 'Sheet-pan dinner with almost nothing to wash.',\n      ['4 salmon fillets', '1 bunch asparagus, trimmed', '1 lemon, sliced', '3 tbsp butter, melted', '3 cloves garlic, minced', '2 tbsp olive oil'], [],\n      ['Heat the oven to 425°F.', 'Toss asparagus with oil and salt on a sheet pan; push to the sides.', 'Set the salmon in the middle, brush with garlic butter, top with lemon.', 'Roast 12 minutes, until the salmon flakes at the thickest part.']),\n    R('f3', 'Garlic Shrimp Pasta', 20, 'garlic shrimp pasta', T.red, 'Fifteen minutes of cooking, most of it boiling water.',\n      ['1 lb shrimp, peeled', '12 oz spaghetti', '5 cloves garlic, thin sliced', '3 tbsp butter', '1 tsp chili flakes', '1 lemon'],\n      [{ n: 'fresh parsley', q: '3 tbsp, chopped', sub: 'scallion tops', sq: '3 tbsp, sliced' }],\n      ['Boil the pasta; save a mug of water.', 'Gently sizzle garlic and chili flakes in butter — do not let it brown.', 'Add shrimp, cook 2 minutes a side until just opaque.', 'Toss with pasta, lemon juice and pasta water until silky.']),\n    R('f2', 'Blackened Fish Tacos', 25, 'fish tacos', T.gold, 'A spice rub does all the flavor work.',\n      ['1 lb white fish fillets', '8 small tortillas', '2 cups shredded cabbage', '1/4 cup sour cream', '1 lime', '2 tsp paprika', '1 tsp cumin', '1/2 tsp cayenne'], [],\n      ['Mix paprika, cumin, cayenne and salt; press onto the fish.', 'Cook 3 minutes a side in a hot oiled pan until the crust is dark.', 'Dress the cabbage with lime and sour cream.', 'Warm the tortillas, flake the fish in, top with slaw.'])\n  ]\n};\nDATA.Other = [DATA.Vegetarian[0], DATA.Chicken[1], DATA.Fish[1]];\n\nconst EXTRA_GROUPS = [\n  { label: 'Vegetables', items: ['Onion', 'Garlic', 'Carrots', 'Bell Pepper', 'Broccoli', 'Spinach', 'Mushrooms', 'Tomatoes', 'Zucchini', 'Cabbage', 'Green Beans', 'Corn'] },\n  { label: 'Grains & Starches', items: ['Rice', 'Pasta', 'Potatoes', 'Tortillas', 'Bread', 'Couscous', 'Quinoa', 'Noodles'] },\n  { label: 'Fruits', items: ['Lemon', 'Lime', 'Apples', 'Avocado', 'Oranges', 'Pineapple'] },\n  { label: 'Dairy & Eggs', items: ['Eggs', 'Milk', 'Butter', 'Cheese', 'Sour Cream', 'Yogurt', 'Parmesan'] },\n  { label: 'Beans & Legumes', items: ['Black Beans', 'Chickpeas', 'Lentils', 'Peas'] },\n  { label: 'Pantry & Sauces', items: ['Soy Sauce', 'Olive Oil', 'Canned Tomatoes', 'Coconut Milk', 'Broth', 'Salsa', 'Honey', 'Vinegar', 'Chili Flakes', 'Curry Powder'] }\n];\n\nconst SEL = { bg: '#231C16', fg: '#FDFAF6', bd: '#231C16' };\nconst UNSEL = { bg: '#FFFFFF', fg: '#4A4038', bd: 'rgba(35,28,22,.14)' };\nconst SEL_SOFT = { bg: '#F0E2D2', fg: '#8A4423', bd: '#C0522C' };\nconst UNSEL_SOFT = { bg: '#FBF6EF', fg: '#6C5F53', bd: 'rgba(35,28,22,.10)' };\n\nconst ALL = Object.values(DATA).flat();\nconst ROUTE_DIR = { home: '', options: 'results/', recipe: 'recipe/' };\nfunction readRoute() {\n  const q = new URLSearchParams(location.search), p = location.pathname;\n  let screen = q.get('screen') || (/\\/results\\/?(index\\.html)?$/.test(p) ? 'options' : /\\/recipe\\/?(index\\.html)?$/.test(p) ? 'recipe' : 'home');\n  const st = { screen };\n  if (q.get('time')) st.time = +q.get('time');\n  if (q.get('main') && DATA[q.get('main')]) st.main = q.get('main');\n  if (q.has('extras')) st.extras = q.get('extras') ? q.get('extras').split('|') : [];\n  if (q.has('moods')) st.moods = q.get('moods') ? q.get('moods').split('|') : [];\n  if (q.get('r')) st.recipe = ALL.find(r => r.id === q.get('r')) || null;\n  if (screen === 'recipe' && !st.recipe) st.screen = 'options';\n  return st;\n}\nfunction loadFavs() { try { return JSON.parse(sessionStorage.getItem('makedo-favs') || '{}'); } catch (e) { return {}; } }\n\nclass Component extends DCLogic {\n  state = Object.assign({\n    screen: 'home', time: 30, main: 'Chicken',\n    extras: ['Garlic', 'Rice', 'Onion'], moods: [],\n    optionalOpen: false, recipe: null, expHave: {}, expMissing: {}, favs: loadFavs()\n  }, readRoute());\n\n  // Real page navigation so each screen has its own URL (needed for UXtweak task success).\n  go(screen, recipe) {\n    const s = this.state;\n    const q = new URLSearchParams(location.search);\n    ['screen', 'r'].forEach(k => q.delete(k));\n    q.set('time', s.time); q.set('main', s.main); q.set('extras', s.extras.join('|')); q.set('moods', s.moods.join('|'));\n    if (screen === 'recipe' && recipe) q.set('r', recipe.id);\n    const p = location.pathname;\n    if (location.protocol === 'file:' || !/^https?:/.test(location.protocol) || /\\.dc\\.html$|standalone/i.test(p)) {\n      q.set('screen', screen);\n      location.assign(p + '?' + q.toString());\n      return;\n    }\n    const base = p.replace(/(results|recipe)\\/?(index\\.html)?$/, '').replace(/[^/]*\\.html$/, '').replace(/\\/?$/, '/');\n    location.assign(base + ROUTE_DIR[screen] + '?' + q.toString());\n  }\n\n  componentDidMount() {\n    if (this.props.optionalOpen) this.setState({ optionalOpen: true });\n  }\n\n  chips(list, key, style) {\n    const on = style === 'soft' ? SEL_SOFT : SEL, off = style === 'soft' ? UNSEL_SOFT : UNSEL;\n    return list.map(label => {\n      const cur = this.state[key];\n      const active = Array.isArray(cur) ? cur.includes(label) : cur === label;\n      const c = active ? on : off;\n      return {\n        label, bg: c.bg, fg: c.fg, bd: c.bd,\n        onPick: () => this.setState(s => {\n          const v = s[key];\n          if (!Array.isArray(v)) return { [key]: label };\n          return { [key]: v.includes(label) ? v.filter(x => x !== label) : [...v, label] };\n        })\n      };\n    });\n  }\n\n  matches() {\n    const set = DATA[this.state.main] || DATA.Chicken;\n    const lim = this.state.time >= 60 ? 999 : this.state.time + 10;\n    let fit = set.filter(r => r.time <= lim);\n    if (fit.length < 2) fit = [...set].sort((a, b) => a.time - b.time).slice(0, 3);\n    if (this.props.sortMode === 'Fastest first') fit = [...fit].sort((a, b) => a.time - b.time);\n    else fit = [...fit].sort((a, b) => a.m.length - b.m.length || a.time - b.time);\n    return fit.slice(0, 5);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const subsOn = this.props.showSubstitutions !== false;\n    const timeLabel = t => (t >= 60 ? '60+ min' : t + ' min');\n\n    const options = this.matches().map(r => {\n      const miss = r.m.length;\n      return {\n        name: r.name, blurb: r.blurb, photo: r.photo, tintA: r.tintA, tintB: r.tintB,\n        timeLabel: timeLabel(r.time),\n        haveLabel: 'Uses ' + r.h.length + ' ingredients you already have',\n        haveNames: r.h.map(x => x.split(',')[0].replace(/^[\\d/\\s]*(lb|oz|cup|cups|can|cans|tbsp|tsp|head|bunch|large|small|cloves|clove)?\\s*/i, '')),\n        haveCaret: s.expHave[r.id] ? 'Hide' : 'Show',\n        showHave: !!s.expHave[r.id],\n        missingLabel: miss === 0 ? 'You already have everything you need' : 'Missing ' + miss + (miss === 1 ? ' ingredient' : ' ingredients'),\n        missingMark: miss === 0 ? '✓' : '!',\n        missingColor: miss === 0 ? '#3E6B4F' : '#B9743F',\n        missingCaret: miss === 0 ? '' : (s.expMissing[r.id] ? 'Hide' : 'Show'),\n        showMissing: miss > 0 && !!s.expMissing[r.id],\n        missing: r.m.map(m => ({ name: m.n, hasSub: subsOn && !!m.sub, sub: m.sub || '' })),\n        onToggleHave: () => this.setState(st => ({ expHave: { ...st.expHave, [r.id]: !st.expHave[r.id] } })),\n        onToggleMissing: () => { if (miss) this.setState(st => ({ expMissing: { ...st.expMissing, [r.id]: !st.expMissing[r.id] } })); },\n        onPick: () => this.go('recipe', r)\n      };\n    });\n\n    const r = s.recipe;\n    const criteria = [timeLabel(s.time), s.main];\n    if (s.moods.length) criteria.push(s.moods.join(' · '));\n    if (s.extras.length) criteria.push('+ ' + s.extras.length + ' on hand');\n\n    const v = {\n      isHome: s.screen === 'home', isOptions: s.screen === 'options', isRecipe: s.screen === 'recipe' && !!r,\n      times: this.chips(['15 min', '30 min', '45 min', '60+ min'], 'timeLabelSel'),\n      mains: this.chips(['Chicken', 'Ground Beef', 'Steak', 'Pork', 'Fish', 'Vegetarian', 'Other'], 'main'),\n      extraGroups: EXTRA_GROUPS.map(g => ({ label: g.label, items: this.chips(g.items, 'extras', 'soft') })),\n      moods: this.chips(['Healthy', 'Comfort Food', 'Light', 'Hearty', 'Spicy', 'Fresh'], 'moods', 'soft'),\n      optionalOpen: s.optionalOpen,\n      optionalToggleLabel: s.optionalOpen ? 'Hide' : 'Add',\n      optionalSubtitle: (s.extras.length + s.moods.length) > 0\n        ? 'Optional · ' + (s.extras.length + s.moods.length) + ' added'\n        : 'Optional · add what else you have',\n      toggleOptional: () => this.setState(st => ({ optionalOpen: !st.optionalOpen })),\n      summaryLine: timeLabel(s.time) + ' · ' + s.main + (s.moods.length ? ' · ' + s.moods[0] : ''),\n      submit: () => this.go('options'),\n      goHome: () => {\n        const q = new URLSearchParams(location.search);\n        ['screen', 'r', 'time', 'main', 'extras', 'moods'].forEach(k => q.delete(k));\n        const qs = q.toString();\n        location.assign(location.pathname.replace(/(results|recipe)\\/?(index\\.html)?$/, '') + (qs ? '?' + qs : ''));\n      },\n      goOptions: () => this.go('options'),\n      optionsTitle: options.length + ' dinners that fit tonight',\n      criteria, options,\n      optionsFooter: 'Ordered by what needs the fewest extra ingredients.'\n    };\n\n    // time chips use their own label-based selection\n    v.times = ['15 min', '30 min', '45 min', '60+ min'].map(label => {\n      const val = parseInt(label, 10);\n      const active = s.time === val;\n      const c = active ? SEL : UNSEL;\n      return { label, bg: c.bg, fg: c.fg, bd: c.bd, onPick: () => this.setState({ time: val }) };\n    });\n\n    if (r) {\n      const fav = !!s.favs[r.id];\n      Object.assign(v, {\n        isFav: fav,\n        favIcon: fav ? '★' : '☆',\n        favBg: fav ? '#FDF3E8' : '#FFFFFF',\n        favFg: fav ? '#B9743F' : '#A3937F',\n        favBd: fav ? '#DFB48C' : 'rgba(35,28,22,.16)',\n        toggleFav: () => this.setState(st => { const favs = { ...st.favs, [r.id]: !st.favs[r.id] }; try { sessionStorage.setItem('makedo-favs', JSON.stringify(favs)); } catch (e) {} return { favs }; }),\n        rName: r.name, rPhoto: r.photo, rTintA: r.tintA, rTintB: r.tintB, rBlurb: r.blurb,\n        rMeta: [timeLabel(r.time) + ' total', r.h.length + ' things you have', r.m.length ? r.m.length + ' to swap or grab' : 'nothing missing'],\n        rIngCount: (r.h.length + r.m.length) + ' total',\n        rHave: r.h,\n        rHasMissing: r.m.length > 0,\n        rAllSet: r.m.length === 0,\n        rMissingHeading: r.m.length === 1 ? 'Missing 1 ingredient' : 'Missing ' + r.m.length + ' ingredients',\n        rMissing: r.m.map(m => ({\n          full: m.q + ' ' + m.n,\n          hasSub: subsOn && !!m.sub,\n          subLine: m.sub ? m.sq + ' ' + m.sub + ' ✓' : ''\n        })),\n        rSteps: r.s.map((text, i) => ({ n: i + 1, text }))\n      });\n    }\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
